<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISTEMA FAC2026 — Facturación Electrónica DTE</title>
  <script>
    (function() {
      var saved = localStorage.getItem('fac2026_theme');
      if (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        saved = 'dark';
      }
      document.documentElement.setAttribute('data-theme', saved || 'light');
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3.3.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=3.3.0">
</head>
<body>
  <div id="app"></div>
  <div id="toast-root"></div>
  <script src="js/html2pdf.bundle.min.js?v=3.3.0"></script>
  <script src="js/qrcode.js?v=3.3.0"></script>
  <script src="js/api.js?v=3.3.0"></script>
  <script src="js/dte-visual.js?v=3.3.0"></script>
  <script src="js/app.js?v=3.3.0"></script>
</body>
</html>
